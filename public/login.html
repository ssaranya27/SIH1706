<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>AI Support Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
            linear-gradient(
                135deg,
                #0f172a,
                #111827,
                #1e293b
            );
            overflow:hidden;
        }

        /* Background Blur */
        .bg-circle{
            position:absolute;
            width:300px;
            height:300px;
            border-radius:50%;
            background:#3b82f6;
            filter:blur(120px);
            opacity:0.4;
        }

        .bg-circle.one{
            top:-50px;
            left:-50px;
        }

        .bg-circle.two{
            bottom:-50px;
            right:-50px;
            background:#8b5cf6;
        }

        /* Login Card */

        .login-card{
            position:relative;
            width:400px;
            padding:40px;
            border-radius:25px;

            background:rgba(255,255,255,0.08);

            border:1px solid rgba(255,255,255,0.1);

            backdrop-filter:blur(15px);

            box-shadow:
            0 8px 32px rgba(0,0,0,0.3);

            color:white;
            z-index:10;
        }

        .logo{
            width:80px;
            height:80px;
            margin:auto;
            margin-bottom:20px;

            border-radius:20px;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(
                135deg,
                #3b82f6,
                #8b5cf6
            );

            font-size:35px;
        }

        h1{
            text-align:center;
            margin-bottom:10px;
            font-size:32px;
        }

        .subtitle{
            text-align:center;
            color:#cbd5e1;
            margin-bottom:30px;
            font-size:14px;
        }

        .input-group{
            position:relative;
            margin-bottom:20px;
        }

        .input-group i{
            position:absolute;
            left:15px;
            top:50%;
            transform:translateY(-50%);
            color:#94a3b8;
        }

        input{
            width:100%;
            padding:15px 15px 15px 45px;

            border:none;
            outline:none;

            border-radius:14px;

            background:rgba(255,255,255,0.08);

            color:white;
            font-size:15px;

            transition:0.3s;
        }

        input::placeholder{
            color:#94a3b8;
        }

        input:focus{
            border:1px solid #3b82f6;
            background:rgba(255,255,255,0.12);
        }

        .login-btn{
            width:100%;
            padding:15px;

            border:none;
            border-radius:14px;

            background:
            linear-gradient(
                135deg,
                #3b82f6,
                #8b5cf6
            );

            color:white;
            font-size:16px;
            font-weight:600;

            cursor:pointer;

            transition:0.3s;
        }

        .login-btn:hover{
            transform:translateY(-2px);
            box-shadow:
            0 10px 20px rgba(59,130,246,0.4);
        }

        .extra{
            margin-top:20px;
            display:flex;
            justify-content:space-between;
            font-size:13px;
            color:#cbd5e1;
        }

        .extra a{
            color:#60a5fa;
            text-decoration:none;
        }

        .extra a:hover{
            text-decoration:underline;
        }

        .bottom-text{
            margin-top:25px;
            text-align:center;
            font-size:13px;
            color:#94a3b8;
        }

    </style>

</head>

<body>

    <div class="bg-circle one"></div>
    <div class="bg-circle two"></div>

    <div class="login-card">

        <div class="logo">
            <i class="fa-solid fa-robot"></i>
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to access your AI Support Assistant
        </p>

        <div class="input-group">
            <i class="fa-solid fa-user"></i>

            <input
                type="text"
                id="loginUsername"
                placeholder="Enter username"
            >
        </div>

        <div class="input-group">
            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter password"
            >
        </div>

        <button
            class="login-btn"
            onclick="login()"
        >
            Login
        </button>

        <div class="extra">

            <a href="#">
                Forgot Password?
            </a>

            <a href="register.html">
                Create Account
            </a>

        </div>

        <div class="bottom-text">
            Powered by Ollama + Mistral AI
        </div>

    </div>

<script src="script.js"></script>

</body>
</html>
