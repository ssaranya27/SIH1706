<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            overflow:hidden;

            background:
            linear-gradient(
                135deg,
                #0f172a,
                #111827,
                #1e293b
            );
        }

        /* Background Glow */

        .circle{

            position:absolute;

            width:320px;
            height:320px;

            border-radius:50%;

            filter:blur(120px);

            opacity:0.4;
        }

        .circle.one{

            background:#3b82f6;

            top:-80px;
            left:-80px;
        }

        .circle.two{

            background:#8b5cf6;

            bottom:-80px;
            right:-80px;
        }

        /* Register Card */

        .register-card{

            position:relative;

            width:420px;

            padding:45px;

            border-radius:28px;

            background:rgba(255,255,255,0.08);

            backdrop-filter:blur(16px);

            border:1px solid rgba(255,255,255,0.1);

            box-shadow:
            0 8px 32px rgba(0,0,0,0.35);

            color:white;

            z-index:10;
        }

        .logo{

            width:90px;
            height:90px;

            margin:auto;
            margin-bottom:25px;

            border-radius:24px;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(
                135deg,
                #8b5cf6,
                #3b82f6
            );

            font-size:40px;
        }

        h1{

            text-align:center;

            font-size:34px;

            margin-bottom:10px;
        }

        .subtitle{

            text-align:center;

            color:#cbd5e1;

            margin-bottom:35px;

            font-size:14px;
        }

        .input-group{

            position:relative;

            margin-bottom:22px;
        }

        .input-group i{

            position:absolute;

            left:16px;
            top:50%;

            transform:translateY(-50%);

            color:#94a3b8;
        }

        input{

            width:100%;

            padding:16px 16px 16px 48px;

            border:none;
            outline:none;

            border-radius:14px;

            background:rgba(255,255,255,0.08);

            color:white;

            font-size:15px;

            transition:0.3s;
        }

        input::placeholder{
            color:#94a3b8;
        }

        input:focus{

            border:1px solid #8b5cf6;

            background:rgba(255,255,255,0.12);
        }

        .register-btn{

            width:100%;

            padding:16px;

            border:none;

            border-radius:14px;

            background:
            linear-gradient(
                135deg,
                #8b5cf6,
                #3b82f6
            );

            color:white;

            font-size:16px;
            font-weight:600;

            cursor:pointer;

            transition:0.3s;
        }

        .register-btn:hover{

            transform:translateY(-3px);

            box-shadow:
            0 12px 24px rgba(139,92,246,0.35);
        }

        .login-link{

            margin-top:25px;

            text-align:center;

            font-size:14px;

            color:#cbd5e1;
        }

        .login-link a{

            color:#60a5fa;

            text-decoration:none;

            font-weight:500;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

        .footer{

            margin-top:25px;

            text-align:center;

            color:#94a3b8;

            font-size:13px;
        }

    </style>

</head>

<body>

    <div class="circle one"></div>
    <div class="circle two"></div>

    <div class="register-card">

        <div class="logo">
            <i class="fa-solid fa-user-plus"></i>
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Register to access your AI support assistant
        </p>

        <!-- Username -->

        <div class="input-group">

            <i class="fa-solid fa-user"></i>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
            >

        </div>

        <!-- Password -->

        <div class="input-group">

            <i class="fa-solid fa-lock"></i>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
            >

        </div>

        <!-- Register Button -->

        <button
            class="register-btn"
            onclick="register()"
        >
            Create Account
        </button>

        <!-- Login Link -->

        <div class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

        <div class="footer">
            Powered by Ollama + Mistral AI
        </div>

    </div>

<script src="script.js"></script>

</body>

</html>
