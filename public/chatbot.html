<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            height:100vh;

            background:
            linear-gradient(
                135deg,
                #0f172a,
                #111827,
                #1e293b
            );

            overflow:hidden;

            color:white;
        }

        /* MAIN LAYOUT */

        .chat-layout{

            height:100vh;

            display:flex;

            justify-content:center;
            align-items:center;

            padding:25px;
        }

        /* MAIN CHAT CARD */

        .chat-container{

            width:100%;
            max-width:1100px;

            height:90vh;

            display:flex;

            background:rgba(255,255,255,0.06);

            border:
            1px solid rgba(255,255,255,0.08);

            backdrop-filter:blur(15px);

            border-radius:30px;

            overflow:hidden;

            box-shadow:
            0 10px 40px rgba(0,0,0,0.35);
        }

        /* SIDEBAR */

        .sidebar{

            width:250px;

            background:rgba(0,0,0,0.2);

            border-right:
            1px solid rgba(255,255,255,0.08);

            padding:25px;

            display:flex;
            flex-direction:column;
        }

        .logo{

            display:flex;
            align-items:center;
            gap:12px;

            font-size:24px;
            font-weight:700;

            margin-bottom:35px;
        }

        .logo i{

            width:50px;
            height:50px;

            border-radius:15px;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(
                135deg,
                #3b82f6,
                #8b5cf6
            );
        }

        .new-chat{

            padding:15px;

            border:none;

            border-radius:15px;

            background:
            linear-gradient(
                135deg,
                #3b82f6,
                #2563eb
            );

            color:white;

            font-size:15px;
            font-weight:600;

            cursor:pointer;

            transition:0.3s;
        }

        .new-chat:hover{

            transform:translateY(-2px);

            box-shadow:
            0 10px 20px rgba(59,130,246,0.35);
        }

        .sidebar-footer{

            margin-top:auto;

            color:#94a3b8;

            text-align:center;

            font-size:13px;
        }

        /* CHAT AREA */

        .chat-area{

            flex:1;

            display:flex;
            flex-direction:column;
        }

        /* TOPBAR */

        .topbar{

            height:80px;

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:0 30px;

            border-bottom:
            1px solid rgba(255,255,255,0.08);
        }

        .topbar h1{

            font-size:24px;
            font-weight:600;
        }

        .user{

            width:45px;
            height:45px;

            border-radius:50%;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(
                135deg,
                #8b5cf6,
                #3b82f6
            );
        }

        /* CHAT BOX */

        #chat-box{

            flex:1;

            overflow-y:auto;

            padding:30px;

            display:flex;
            flex-direction:column;

            gap:18px;
        }

        /* MESSAGES */

        .message{

            max-width:75%;

            padding:16px 20px;

            border-radius:18px;

            line-height:1.7;

            animation:fadeIn 0.3s ease;
        }

        .bot-message{

            align-self:flex-start;

            background:rgba(255,255,255,0.08);

            border:
            1px solid rgba(255,255,255,0.08);
        }

        .user-message{

            align-self:flex-end;

            background:
            linear-gradient(
                135deg,
                #3b82f6,
                #2563eb
            );
        }

        /* INPUT AREA */

        .input-area{

            padding:20px 30px;

            border-top:
            1px solid rgba(255,255,255,0.08);

            display:flex;

            gap:15px;
        }

        #user-input{

            flex:1;

            padding:16px 20px;

            border:none;
            outline:none;

            border-radius:18px;

            background:rgba(255,255,255,0.08);

            color:white;

            font-size:15px;
        }

        #user-input::placeholder{
            color:#94a3b8;
        }

        .send-btn{

            width:60px;
            height:60px;

            border:none;

            border-radius:18px;

            background:
            linear-gradient(
                135deg,
                #8b5cf6,
                #3b82f6
            );

            color:white;

            font-size:20px;

            cursor:pointer;

            transition:0.3s;
        }

        .send-btn:hover{

            transform:scale(1.05);

            box-shadow:
            0 10px 20px rgba(139,92,246,0.35);
        }

        /* SCROLLBAR */

        #chat-box::-webkit-scrollbar{
            width:6px;
        }

        #chat-box::-webkit-scrollbar-thumb{

            background:#475569;

            border-radius:10px;
        }

        /* ANIMATION */

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(10px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* MOBILE */

        @media(max-width:768px){

            .sidebar{
                display:none;
            }

            .chat-container{

                height:95vh;
            }

            .message{
                max-width:90%;
            }

            .topbar h1{
                font-size:18px;
            }
        }

    </style>

</head>

<body>

<div class="chat-layout">

    <div class="chat-container">

        <!-- SIDEBAR -->

        <div class="sidebar">

            <div class="logo">

                <i class="fa-solid fa-robot"></i>

                <span>AI Support</span>

            </div>

            <button class="new-chat">

                <i class="fa-solid fa-plus"></i>

                New Chat

            </button>

            <div class="sidebar-footer">

                Powered by Ollama + Mistral AI

            </div>

        </div>

        <!-- CHAT AREA -->

        <div class="chat-area">

            <!-- TOPBAR -->

            <div class="topbar">

                <h1>AI Customer Support Assistant</h1>

                <div class="user">

                    <i class="fa-solid fa-user"></i>

                </div>

            </div>

            <!-- CHAT BOX -->

            <div id="chat-box">

                <div class="message bot-message">

                    Hello 👋 <br><br>

                    How can I help you today?

                </div>

            </div>

            <!-- INPUT -->

            <div class="input-area">

                <input
                    type="text"
                    id="user-input"
                    placeholder="Type your message..."
                >

                <button
                    class="send-btn"
                    onclick="sendMessage()"
                >

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
